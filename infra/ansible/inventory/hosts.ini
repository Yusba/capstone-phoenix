
# Fill in the IPs from `terraform output` in infra/terraform/.
# public_ip = used by Ansible/SSH to reach the node from your laptop
# private_ip = used internally for k3s server<->agent communication

[server]
control-plane ansible_host=54.154.154.120 private_ip=172.31.1.180

[agents]
worker-0 ansible_host=108.131.80.20 private_ip=172.31.1.145
worker-1 ansible_host=3.249.215.165 private_ip=172.31.1.234

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
